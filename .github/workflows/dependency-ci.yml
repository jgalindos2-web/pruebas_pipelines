name: Dependency CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: hospital_app/requirements.txt

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hospital_app/requirements.txt

      - name: Test app
        run: python -m pytest hospital_app/tests -v
